# Docker Config for Production.

services:

  server: # Service Server

    container_name: keystorage_api
    
    build: 
      context: ./server      # Contexto (dependências, scripts, build)
      dockerfile: dockerfile # Dockerfile
    
    ports:
      - '5000:5000'           # Mapeamento de Portas (máquina, contêiner)
    
    environment:              # Variáveis de Ambiente
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=5000
      - ORIGIN_URL=http://localhost:3000

    restart: always # Reiniciar SEMPRE


  app:

    container_name: keystorage_app

    build:  
      context: ./app         # Contexto (dependências, scripts, build)
      dockerfile: dockerfile # Dockerfile

    ports:
      - '3000:3000'

    environment:               # Variáveis de Ambiente
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - API_URL=http://server:5000

    depends_on: # Depende de Outro Serviço
      - server

    restart: always
