services:
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - ORIGIN=http://localhost:3000
    
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    
    depends_on:
      - server
    
    restart: unless-stopped
    